name: Build Tauri trial
on:
  workflow_dispatch:
  push:
    branches: [tauri-webview2]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci --ignore-scripts
      - run: node scripts/build-tauri.mjs
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo build --release --manifest-path src-tauri/Cargo.toml
      - name: Package portable trial
        shell: pwsh
        run: |
          New-Item -ItemType Directory TIME3-Tauri-trial
          Copy-Item src-tauri/target/release/time3-tauri.exe TIME3-Tauri-trial/TIME3.exe
          Copy-Item TAURI-TRIAL.md TIME3-Tauri-trial/README.md
          Copy-Item THIRD_PARTY_NOTICES.md TIME3-Tauri-trial/
          Compress-Archive -Path TIME3-Tauri-trial -DestinationPath TIME3-Tauri-trial-win-x64.zip
          Get-FileHash TIME3-Tauri-trial-win-x64.zip -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: TIME3-Tauri-trial-win-x64
          path: TIME3-Tauri-trial-win-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: rust-lockfile
          path: src-tauri/Cargo.lock
